<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otto Display System</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
        --panel: rgba(255, 255, 255, 0.12);
        --text: #f4f7fb;
        --accent: #ffd166;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .layout {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
        padding: 20px;
      }
      .card {
        grid-column: span 4;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 16px;
        backdrop-filter: blur(8px);
      }
      .hero { grid-column: span 12; }
      .countdown { font-size: 3rem; color: var(--accent); }
      @media (max-width: 900px) {
        .card { grid-column: span 12; }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="card hero">
        <h1 id="role-title">Otto Display</h1>
        <p id="phase">Loading current phase...</p>
        <div id="countdown" class="countdown">--:--</div>
      </section>
      <section class="card"><h2>Announcements</h2><div id="announcements"></div></section>
      <section class="card"><h2>Homework</h2><div id="homework"></div></section>
      <section class="card"><h2>Calendar</h2><div id="calendar"></div></section>
      <section class="card"><h2>Weather</h2><div id="weather"></div></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
