<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otto Display</title>
    <style>
      :root {
        --display-bg: linear-gradient(135deg, #0b132b 0%, #1c2541 42%, #3a506b 100%);
        --panel-bg: rgba(17, 27, 41, 0.78);
        --shell-bg: rgba(13, 24, 36, 0.82);
        --text: #f2f7ff;
        --muted: rgba(242, 247, 255, 0.72);
        --accent: #ffd166;
        --border: rgba(110, 202, 255, 0.9);
        --header-bg: rgba(11, 19, 34, 0.86);
        --header-border: rgba(255, 255, 255, 0.12);
        --badge-bg: rgba(255, 255, 255, 0.12);
        --badge-border: rgba(255, 255, 255, 0.12);
        --card-border: rgba(255, 255, 255, 0.16);
        --app-border-width: 3px;
        --app-radius: 12px;
        --card-radius: 16px;
        --app-shadow: 0 0 0 1px rgba(102, 214, 255, 0.2), 0 0 32px rgba(102, 214, 255, 0.12);
        --card-shadow-inset: inset 0 1px 0 rgba(255,255,255,0.06);
        --transition-fade-duration: 320ms;
        --transition-slide-duration: 320ms;
        --transition-dissolve-duration: 320ms;
        --page-transition: 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        background: var(--display-bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      #app {
        width: min(100%, 1200px);
        min-height: 620px;
        background: var(--shell-bg);
        border: var(--app-border-width) solid var(--border);
        border-radius: var(--app-radius);
        box-shadow: var(--app-shadow);
        overflow: hidden;
      }

      .display-shell {
        min-height: 620px;
        background: var(--display-bg);
        transition: opacity var(--page-transition), transform var(--page-transition), filter var(--page-transition);
      }

      .transition-fade { animation: fadeIn var(--transition-fade-duration) ease; }
      .transition-slide { animation: slideIn var(--transition-slide-duration) ease; }
      .transition-dissolve { animation: dissolveIn var(--transition-dissolve-duration) ease; }

      @keyframes fadeIn {
        from { opacity: 0; filter: blur(4px); }
        to { opacity: 1; filter: blur(0); }
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(28px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes dissolveIn {
        from { opacity: 0.35; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }

      .display-header {
        padding: 18px 22px 12px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--header-border);
      }

      .display-header h1 {
        margin: 0;
        font-size: clamp(2rem, 2vw, 2.5rem);
      }

      .display-header .meta {
        margin-top: 6px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .page-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 520px;
        padding: 22px;
      }

      .page-badge {
        margin-bottom: 16px;
        align-self: flex-start;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--badge-bg);
        border: 1px solid var(--badge-border);
        color: var(--text);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .single-module-card {
        width: min(100%, 820px);
        min-height: 270px;
        margin: 0 auto;
        background: var(--panel-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--card-radius);
        padding: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: var(--card-shadow-inset);
      }

      .single-module-card h2 {
        margin: 0 0 18px;
        font-size: clamp(2.1rem, 2.8vw, 3.4rem);
        letter-spacing: 0.02em;
        color: var(--text);
      }

      .single-module-card p {
        margin: 0;
        font-size: clamp(1.1rem, 1.6vw, 1.8rem);
        line-height: 1.6;
        color: var(--muted);
      }

      @media (max-width: 800px) {
        body { padding: 12px; }
        #app, .display-shell { min-height: 500px; }
        .single-module-card { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script src="/time-digital-renderer.js"></script>
    <script src="/time-analog-renderer.js"></script>
    <script src="/time-object-renderer.js"></script>
    <script src="/weather-object-renderer.js"></script>
    <script src="/object-renderers.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
